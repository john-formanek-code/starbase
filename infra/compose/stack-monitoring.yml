name: monitoring
services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports: ["3002:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ../../data/volumes/grafana-data:/var/lib/grafana
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks: [monitoring, proxy]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports: ["9091:9090"]
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../data/volumes/prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks: [monitoring]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports: ["9093:9093"]
    volumes:
      - ../config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [monitoring]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks:
      - monitoring
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=:9101'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    ports:
      - "9101:9101"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks:
      - monitoring
    restart: unless-stopped

  blackbox_exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox_exporter
    ports: ["9117:9115"]
    volumes:
      - ../config/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [monitoring]
    restart: unless-stopped

  snmp_exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp_exporter
    ports: ["9116:9116"]
    volumes:
      - ../config/snmp/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [monitoring]
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml -validation.allow-structured-metadata=false
    ports: ["3100:3100"]
    volumes:
      - ../config/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - ../../data/volumes/loki-data:/loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks: [monitoring]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/log:/var/log:ro
      - ../config/promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [monitoring]
    restart: unless-stopped

networks:
  monitoring:
    external: true
  proxy:
    external: true
