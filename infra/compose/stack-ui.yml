name: ui
services:
  starbase-ui:
    build:
      context: ../../apps/ui
      dockerfile: Dockerfile
    container_name: starbase-ui
    restart: unless-stopped
    depends_on:
      - starbase-api
    ports:
      - "${UI_PORT:-8088}:80"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - proxy

  starbase-api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: starbase-api
    restart: unless-stopped
    environment:
      HOST_ROOT: /host
      STARBASE_DEMO: "0"
      PORT: "3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/host
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - proxy

networks:
  proxy:
    external: true
