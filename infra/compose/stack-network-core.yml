name: network-core
services:
  # The Router - VyOS
  router:
    image: afla/vyos:1.4
    container_name: lab-router
    privileged: true
    volumes:
      - ../../data/volumes/router/config:/config
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks: [vlan10_mgmt, vlan20_srv, vlan30_clients, vlan60_dmz]
    restart: unless-stopped

  # PKI - Certificate Authority
  step-ca:
    image: smallstep/step-ca:latest
    container_name: step-ca
    environment:
      - DOCKER_STEPCA_INIT_NAME=starbase-CA
      - DOCKER_STEPCA_INIT_PROVISIONER_NAME=admin
      - DOCKER_STEPCA_INIT_PASSWORD=adminpassword
      - DOCKER_STEPCA_INIT_SSH=true
    volumes:
      - ../../data/volumes/step-ca:/home/step
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [vlan10_mgmt]
    restart: unless-stopped

  # RADIUS - Network Auth
  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: freeradius
    volumes:
      - ../../data/volumes/radius/config:/etc/raddb
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [vlan10_mgmt]
    restart: unless-stopped

  # NTP Server
  ntp:
    image: cturra/ntp:latest
    container_name: ntp-server
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [vlan10_mgmt]
    restart: unless-stopped

networks:
  vlan10_mgmt:
    external: true
  vlan20_srv:
    external: true
  vlan30_clients:
    external: true
  vlan60_dmz:
    external: true