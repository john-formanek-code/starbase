name: cloud
services:
  nextcloud-db:
    image: postgres:15-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=nextcloud_db_pass
      - POSTGRES_DB=nextcloud
    volumes:
      - ../../data/volumes/nextcloud/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks: [database]

  nextcloud-redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    volumes:
      - ../../data/volumes/nextcloud/redis:/data
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [database]

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    environment:
      - POSTGRES_HOST=nextcloud-db
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=nextcloud_db_pass
      - POSTGRES_DB=nextcloud
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost ${MY_DOMAIN}
      - OVERWRITEPROTOCOL=http
      - OVERWRITECLIURL=http://localhost:8080
    volumes:
      - ../../data/volumes/nextcloud/html:/var/www/html
      - ../../data/volumes/nextcloud/data:/var/www/html/data
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks: [proxy, database]

networks:
  proxy:
    external: true
  database:
    external: true
