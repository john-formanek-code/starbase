name: cyber
services:
  # Wazuh Indexer - Data storage
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.2
    container_name: wazuh-indexer
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks: [monitoring]
    restart: unless-stopped

  # Wazuh Manager - The Brain
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: wazuh-manager
    depends_on: [wazuh-indexer]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks: [monitoring]
    restart: unless-stopped

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.2
    container_name: wazuh-dashboard
    depends_on: [wazuh-manager]
    environment:
      - WAZUH_MANAGER_URL=https://wazuh-manager
    ports:
      - "8443:5601"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks: [proxy, monitoring]
    restart: unless-stopped

  # Vulnerability Scanner
  openvas:
    image: mikesplain/openvas:latest
    container_name: openvas
    ports:
      - "9390:9390"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks: [vlan10_mgmt]
    restart: unless-stopped

  # Pentest lab
  kali:
    image: kalilinux/kali-rolling:latest
    container_name: kali
    command: sleep infinity
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [vlan30_clients]
    restart: unless-stopped

  victim-server:
    image: vulnerables/web-dvwa
    container_name: victim-server
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [vlan30_clients]
    restart: unless-stopped

  # Tools
  cyberchef:
    image: ghcr.io/gchq/cyberchef:latest
    container_name: cyberchef
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [proxy]
    restart: unless-stopped

  # Password Manager
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    volumes:
      - ../../data/volumes/vaultwarden/data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks: [proxy]
    restart: unless-stopped

networks:
  monitoring:
    external: true
  proxy:
    external: true
  vlan10_mgmt:
    external: true
  vlan30_clients:
    external: true

volumes:
  vaultwarden-data:
