name: media
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Prague
    volumes:
      - ../../data/volumes/jellyfin/config:/config
      - ../../data/volumes/jellyfin/tvshows:/data/tvshows
      - ../../data/volumes/jellyfin/movies:/data/movies
    ports:
      - "8096:8096"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks: [proxy]

networks:
  proxy:
    external: true
