name: automation
services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ../../data/volumes/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ../../data/volumes/mosquitto/config:/mosquitto/config
      - ../../data/volumes/mosquitto/data:/mosquitto/data
      - ../../data/volumes/mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9005:9001"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks:
      - proxy
      - vlan30_clients

  nodered:
    container_name: nodered
    image: nodered/node-red:latest
    restart: unless-stopped
    environment:
      - TZ=Europe/Prague
    volumes:
      - ../../data/volumes/nodered/data:/data
    ports:
      - "1880:1880"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks:
      - proxy
      - vlan30_clients

networks:
  proxy:
    external: true
  vlan30_clients:
    external: true