name: business
services:
  bookstack-db:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: bookstack-db
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Prague
      - MYSQL_ROOT_PASSWORD=bookstack_root_pass
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=bookstack_db_pass
    volumes:
      - ./bookstack/db:/config
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [database]

  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Prague
      - APP_URL=http://localhost:6875
      - DB_HOST=bookstack-db
      - DB_USER=bookstack
      - DB_PASS=bookstack_db_pass
      - DB_DATABASE=bookstack
    volumes:
      - ./bookstack/app:/config
    ports:
      - "6875:80"
    restart: unless-stopped
    depends_on:
      - bookstack-db
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [proxy, database]

networks:
  proxy:
    external: true
  database:
    external: true
