name: containers
services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./portainer-data:/data
    ports:
      - "9000:9000"
      - "9443:9443"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks: [proxy, vlan10_mgmt]

networks:
  proxy:
    external: true
  vlan10_mgmt:
    external: true
