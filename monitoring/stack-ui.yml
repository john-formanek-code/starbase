services:
  starbase-ui:
    build:
      context: ../starbase-ui
      dockerfile: Dockerfile
    container_name: starbase-ui
    restart: unless-stopped
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks:
      - proxy

  starbase-api:
    build:
      context: ../starbase-api
      dockerfile: Dockerfile
    container_name: starbase-api
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/formijan/projects/starbase:/home/formijan/projects/starbase
    # Overwrite index.js path mapping internally if needed, 
    # but the simplest is to keep paths relative to the project root
    working_dir: /home/formijan/projects/starbase/starbase-api
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks:
      - proxy

networks:
  proxy:
    external: true
